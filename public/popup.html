<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mii Creator</title>
    <meta property="og:title" content="Mii Creator - Web-based Mii editor" />
    <meta
      property="og:description"
      content="Create and share Mii characters online with just a few clicks!"
    />
    <meta
      name="description"
      content="Create and share Mii characters online with just a few clicks!"
    />
    <meta
      name="keywords"
      content="Mii, Mii Creator, Nintendo, Pretendo, FFL, Wii U, 3DS, Mii Maker, Web Mii Maker"
    />
    <meta property="theme-color" content="#484848" />
    <meta property="og:site_name" content="mii.nxw.pw" />
    <meta property="og:image" content="/assets/images/preview.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="/assets/images/preview.png" />
    <link
      rel="shortcut icon"
      href="/assets/images/favicon.ico"
      type="image/x-icon"
    />
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />
    <link
      rel="preload"
      href="/assets/fonts/NTLG.woff2"
      as="font"
      type="font/woff"
      crossorigin="anonymous"
    />
    <style>
      html,
      body {
        background-color: #000000 !important;
        color: white !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        user-select: none !important;

        background-image: url("assets/images/main_bg.svg");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      * {
        user-select: none !important;
        box-sizing: border-box;
      }

      .popup {
        border: 2px solid #484848;
        background: #000000;
        border-radius: 8px;
        max-width: 100%;
        width: max-content;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 1.5rem 1.75rem;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 1rem;
      }

      .popup .header {
        font-size: 1.3rem;
        font-weight: 500;
        text-align: center;
        line-height: 1.8em;
      }
      .popup .header .title {
        font-size: 1.25em;
      }
      .popup .permissions {
        font-size: 20px;
        font-weight: 500;
        margin: 0 0 0 24px;
        padding: 0;
      }
      .popup .confirmation {
        font-size: 1.5rem;
        font-weight: 500;
      }

      .button {
        appearance: none;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0.5rem 1.5rem;
        background: #000000;
        border: 1px solid #454545;
        border-radius: 8px;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .button:hover {
        filter: brightness(1.25);
      }
      .button.primary {
        background: #176076;
      }
    </style>
  </head>
  <body>
    <script type="module" src="dist/popup.js?t=135"></script>
  </body>
</html>
